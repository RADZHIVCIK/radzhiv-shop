
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RADZHIV.SHOP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { 
            --bg: #0c0c0e; 
            --surface: #161619;
            --card-bg: #1c1c21; 
            --text: #ffffff; 
            --text-muted: #8b8b93; 
            --accent: #005FF9; 
            --price: #F91155;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: radial-gradient(circle at 50% 0%, #1e1e24 0%, var(--bg) 70%); color: var(--text); margin: 0; padding: 0; min-height: 100vh; }
        
        /* HEADER */
        .top-header { 
            display: flex; align-items: center; gap: 20px; padding: 15px 30px; 
            background: rgba(22, 22, 25, 0.8); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky; top: 0; z-index: 100; 
        }
        .logo { font-weight: 900; font-size: 24px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text); text-decoration: none; }
        .search-wrapper { flex-grow: 1; position: relative; max-width: 600px; }
        .search-box { width: 100%; padding: 12px 20px; border-radius: 12px; border: none; background: rgba(255,255,255,0.05); color: var(--text); font-size: 15px; outline: none; transition: 0.3s; }
        .search-box:focus { background: rgba(255,255,255,0.1); box-shadow: 0 0 0 2px var(--accent); }
        .header-actions { display: flex; gap: 20px; font-size: 24px; align-items: center; margin-left: auto; }
        .header-actions span { cursor: pointer; transition: transform 0.2s, color 0.2s; }
        .header-actions span:hover { transform: scale(1.1); }
        .cart-icon { position: relative; }
        .cart-badge { position: absolute; top: -6px; right: -10px; background: var(--price); color: white; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 10px; display: none; }

        /* PAGE TITLE */
        .page-title-wrap { max-width: 1300px; margin: 30px auto 10px auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
        .page-title { font-size: 28px; font-weight: 900; margin: 0; }
        .page-title span { color: var(--price); }

        /* CATEGORIES */
        .categories-wrap { position: sticky; top: 73px; z-index: 99; background: rgba(12, 12, 14, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); padding: 15px 0; margin-bottom: 20px; }
        .categories { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; max-width: 1300px; margin: 0 auto; padding: 0 20px; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn { background: rgba(255,255,255,0.05); border: 1px solid transparent; color: var(--text); padding: 8px 20px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .cat-btn:hover { background: rgba(255,255,255,0.1); }
        .cat-btn.active { background: var(--accent); color: white; }

        /* GRID */
        .container { max-width: 1300px; margin: 0 auto; padding: 0 20px 40px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        
        /* CARD */
        .card { 
            background: var(--card-bg); border-radius: 16px; display: flex; flex-direction: column; 
            cursor: pointer; position: relative; transition: transform 0.2s, box-shadow 0.2s; 
            overflow: hidden; border: 1px solid rgba(255,255,255,0.03);
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.1); }
        .card-img-wrapper { position: relative; width: 100%; aspect-ratio: 1/1; overflow: hidden; background: #000; }
        .card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
        .card:hover .card-img-wrapper img { transform: scale(1.08); }
        
        .badge { position: absolute; top: 10px; left: 10px; background: var(--price); color: white; font-size: 11px; font-weight: 900; padding: 4px 8px; border-radius: 8px; text-transform: uppercase; z-index: 10; }
        .badge.sold { background: #555; }
        
        .heart { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); width: 34px; height: 34px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 16px; z-index: 10; transition: 0.2s; }
        .heart:hover { background: rgba(0,0,0,0.9); transform: scale(1.1); }
        .heart.active { color: var(--price); }
        
        .card-info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .title { font-size: 14px; font-weight: 600; margin: 0 0 8px 0; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 40px; }
        .price-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; margin-top: auto; flex-wrap: wrap; }
        .price { font-size: 20px; font-weight: 900; color: var(--price); }
        .old-price { font-size: 13px; text-decoration: line-through; color: var(--text-muted); }
        
        .buy-btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 14px; width: 100%; cursor: pointer; transition: 0.2s; }
        .buy-btn:hover { background: #0046bd; }
        .buy-btn.disabled { background: #333; color: #777; pointer-events: none; }

        /* MODAL ITEM */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--surface); width: 100%; max-width: 1000px; border-radius: 24px; padding: 0; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.1); }
        .modal-close { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; cursor: pointer; z-index: 20; display: flex; justify-content: center; align-items: center; }
        
        .modal-body { display: flex; flex-direction: column; }
        @media (min-width: 768px) { .modal-body { flex-direction: row; } }
        
        /* SLIDER FIXED */
        .slider-container { flex: 1.2; background: #000; position: relative; border-radius: 24px 0 0 24px; overflow: hidden; display: flex; align-items: center; }
        .slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; width: 100%; height: 100%; scroll-behavior: smooth; }
        .slider::-webkit-scrollbar { display: none; }
        .slider img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: contain; scroll-snap-align: center; max-height: 60vh; }
        
        /* СТРЕЛКИ СЛАЙДЕРА */
        .slider-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; z-index: 10; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .slider-arrow:hover { background: var(--accent); }
        .slider-arrow.left { left: 10px; }
        .slider-arrow.right { right: 10px; }

        .modal-details { flex: 1; padding: 30px; display: flex; flex-direction: column; background: var(--surface); border-radius: 0 24px 24px 0; }
        .modal-title { font-size: 24px; font-weight: 900; margin: 0 0 10px 0; line-height: 1.3; }
        .modal-price-row { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .modal-price { font-size: 30px; font-weight: 900; color: var(--price); }
        .modal-desc { font-size: 15px; line-height: 1.6; color: var(--text-muted); margin-bottom: 20px; white-space: pre-wrap; flex-grow: 1; }
        
        .sizes-wrap { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .size-btn { padding: 10px 18px; border: 2px solid #333; background: transparent; color: var(--text); border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .size-btn.active { border-color: var(--accent); background: var(--accent); color: white; }
        
        .action-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .modal-buy-btn { background: var(--accent); color: white; border: none; padding: 16px; border-radius: 14px; font-weight: 900; width: 100%; cursor: pointer; font-size: 16px; transition: 0.2s; flex: 1; }
        .modal-buy-btn:hover { background: #0046bd; }
        .ask-btn { background: rgba(255,255,255,0.05); color: white; border: none; padding: 16px; border-radius: 14px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .ask-btn:hover { background: rgba(255,255,255,0.1); }

        .similar-title { margin-top: 30px; font-size: 18px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .similar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .similar-item { cursor: pointer; background: rgba(255,255,255,0.03); padding: 5px; border-radius: 10px; text-align: center; transition: 0.2s; }
        .similar-item:hover { background: rgba(255,255,255,0.08); }
        .similar-item img { width: 100%; border-radius: 8px; aspect-ratio: 1/1; object-fit: cover; margin-bottom: 5px; }
        .similar-item div { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .similar-item b { color: var(--price); }

        /* CART & SUCCESS */
        .cart-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 1100; align-items: center; justify-content: center; padding: 20px; }
        .cart-content { background: var(--surface); width: 100%; max-width: 600px; border-radius: 24px; padding: 30px; max-height: 90vh; overflow-y: auto; position: relative; border: 1px solid rgba(255,255,255,0.1); }
        .cart-item { display: flex; gap: 15px; margin-bottom: 15px; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; align-items: center; }
        .cart-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
        .cart-item-info { flex-grow: 1; }
        .cart-item-info h4 { margin: 0 0 5px 0; font-size: 14px; }
        .cart-item-info span { font-size: 14px; color: var(--price); font-weight: bold; }
        .cart-total { font-size: 22px; font-weight: 900; text-align: right; margin: 20px 0; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .promo-input { width: 100%; padding: 14px; border-radius: 12px; border: none; background: rgba(255,255,255,0.05); color: white; margin-bottom: 15px; font-size: 15px; outline: none; }

        /* EMPTY STATE */
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; text-align: center; grid-column: 1 / -1; }
        .empty-state .icon { font-size: 60px; margin-bottom: 20px; opacity: 0.5; }
        .empty-state h3 { font-size: 20px; margin: 0 0 10px 0; }
        .empty-state p { color: var(--text-muted); margin: 0; }

        /* ADAPTIVE */
        @media (max-width: 600px) {
            .top-header { flex-direction: column; padding: 15px; gap: 15px; }
            .search-wrapper { width: 100%; }
            .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .card-info { padding: 10px; }
            .title { font-size: 13px; height: 36px; }
            .price { font-size: 16px; }
            .buy-btn { font-size: 13px; padding: 10px; }
            .modal-content { border-radius: 20px 20px 0 0; max-height: 95vh; margin-top: auto; margin-bottom: 0; flex-direction: column; }
            .modal-body { flex-direction: column; }
            .slider-container { border-radius: 20px 20px 0 0; width: 100%; height: 300px; }
            .modal-details { padding: 20px; border-radius: 0; }
            .modal-title { font-size: 20px; }
            .similar-grid { grid-template-columns: repeat(2, 1fr); }
            .slider-arrow { display: none; } /* На телефоне листаем свайпом */
        }
    </style>
</head>
<body>
    <div class="top-header">
        <a href="#" class="logo" onclick="resetView(); return false;">RADZHIV.SHOP</a>
        <div class="search-wrapper"><input type="text" id="search" class="search-box" placeholder="Искать товары, бренды..."></div>
        <div class="header-actions">
            <span id="fav-icon" onclick="toggleFavView()" title="Избранное">❤️</span>
            <span class="cart-icon" onclick="openCart()" title="Корзина">🛒<span class="cart-badge" id="cart-badge">0</span></span>
        </div>
    </div>
    
    <div class="page-title-wrap">
        <h1 class="page-title" id="page-title">Каталог товаров</h1>
    </div>

    <div class="categories-wrap">
        <div class="categories" id="categories-container"></div>
    </div>

    <div class="container">
        <div class="grid" id="product-grid"></div>
    </div>

    <!-- МОДАЛКА ТОВАРА -->
    <div class="modal" id="productModal" onclick="if(event.target===this) closeModal()">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-body">
                <div class="slider-container">
                    <button class="slider-arrow left" onclick="moveSlider(-1)">❮</button>
                    <div class="slider" id="modal-slider"></div>
                    <button class="slider-arrow right" onclick="moveSlider(1)">❯</button>
                </div>
                <div class="modal-details">
                    <h2 id="modal-title" class="modal-title"></h2>
                    <div class="modal-price-row">
                        <div id="modal-price" class="modal-price"></div>
                        <div id="modal-old-price" class="old-price"></div>
                    </div>
                    <div class="sizes-wrap" id="modal-sizes"></div>
                    <div id="modal-desc" class="modal-desc"></div>
                    
                    <div class="action-buttons">
                        <button class="modal-buy-btn" id="modal-buy" onclick="addToCartFromModal()">В корзину</button>
                        <button class="ask-btn" onclick="askQuestion()">💬</button>
                    </div>
                    
                    <div class="similar-title">Похожие товары</div>
                    <div class="similar-grid" id="similar-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА КОРЗИНЫ -->
    <div class="cart-modal" id="cartModal" onclick="if(event.target===this) closeCart()">
        <div class="cart-content">
            <button class="modal-close" onclick="closeCart()">✕</button>
            <h2 style="margin-top:0;">Корзина</h2>
            <div id="cart-items-wrap"></div>
            <div class="cart-total" id="cart-total">Итого: 0 ₽</div>
            <input type="text" id="promo-input" class="promo-input" placeholder="Введите промокод (если есть)">
            <button class="modal-buy-btn" onclick="checkout()">Оформить заказ</button>
        </div>
    </div>

    <!-- ОКНО УСПЕХА -->
    <div class="cart-modal" id="successModal" onclick="if(event.target===this) closeSuccess()">
        <div class="cart-content" style="text-align: center; max-width: 400px;">
            <div style="font-size: 60px; margin-bottom: 20px;">✅</div>
            <h2 style="margin: 0 0 10px 0;">Заказ сформирован!</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Чтобы получить товар, перейдите в нашего Телеграм-бота и нажмите "Оформить заказ" там.</p>
            <a href="https://t.me/radzhiv_shop_bot" style="display: block; background: var(--accent); color: white; text-decoration: none; padding: 16px; border-radius: 12px; font-weight: bold; font-size: 16px;">Перейти в бота</a>
            <button class="ask-btn" style="width: 100%; margin-top: 10px;" onclick="closeSuccess()">Закрыть</button>
        </div>
    </div>

    <script>

        if (tg) { tg.expand(); tg.setHeaderColor('#0c0c0e'); }

, "category": "Куртки", "status": "instock", "desc": "Легкая куртка-бомбер прямого кроя.  Подкладка - дышащая сетка. Застегивается на молнию.\nТовар Б/У\nБренд: O'Stin\nРазмер: 44 (S/M)\nЦвет: Синий\nСезон: Демисезон\nМатериал: Полиэстер\nСостояние: Хорошее\n⚠️ Нюанс: утерян шнурок внутренней кулиски на талии (металлические люверсы на месте, при желании можно вдеть новый). В остальном ткань, молния и манжеты полностью без дефектов.", "sizes": [], "imgs": ["img/5_img_0.jpg", "img/5_img_1.jpg", "img/5_img_2.jpg"]}];
        
        let currentProduct = null;
        let currentCategory = 'Все';
        let selectedSize = "";
        let showFavoritesOnly = false;
        
        let cart = JSON.parse(localStorage.getItem('radzhiv_cart')) || [];
        let favorites = JSON.parse(localStorage.getItem('radzhiv_favs')) || [];
        
        let currentSlideIndex = 0;

        const grid = document.getElementById('product-grid');
        const searchInput = document.getElementById('search');
        const modal = document.getElementById('productModal');
        const catContainer = document.getElementById('categories-container');
        const pageTitle = document.getElementById('page-title');
        const favIcon = document.getElementById('fav-icon');

        function updateCartBadge() {
            document.getElementById('cart-badge').innerText = cart.length;
            document.getElementById('cart-badge').style.display = cart.length > 0 ? 'block' : 'none';
        }

        function resetView() {
            currentCategory = 'Все';
            showFavoritesOnly = false;
            searchInput.value = '';
            pageTitle.innerHTML = 'Каталог товаров';
            favIcon.style.color = 'white';
            initCategories();
            filterProducts();
        }

        function initCategories() {
            const cats = ['Все', ...new Set(products.map(p => p.category).filter(Boolean))];
            catContainer.innerHTML = '';
            cats.forEach(c => {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${c === currentCategory && !showFavoritesOnly ? 'active' : ''}`;
                btn.innerText = c;
                btn.onclick = () => { 
                    currentCategory = c; 
                    showFavoritesOnly = false; 
                    pageTitle.innerHTML = `Категория: ${c}`;
                    favIcon.style.color = 'white';
                    initCategories(); 
                    filterProducts(); 
                };
                catContainer.appendChild(btn);
            });
        }

        function filterProducts() {
            const term = searchInput.value.toLowerCase();
            let filtered = products;
            if (currentCategory !== 'Все') filtered = filtered.filter(p => p.category === currentCategory);
            if (term) filtered = filtered.filter(p => p.name.toLowerCase().includes(term));
            renderProducts(filtered);
        }

        function toggleFavView() {
            showFavoritesOnly = !showFavoritesOnly;
            if (showFavoritesOnly) {
                currentCategory = 'Все';
                pageTitle.innerHTML = '❤️ Избранное';
                favIcon.style.color = 'var(--price)';
                initCategories();
                
                const favProducts = products.filter(p => favorites.includes(p.id));
                if (favProducts.length === 0) {
                    grid.innerHTML = `<div class="empty-state"><div class="icon">🤍</div><h3>В избранном пока пусто</h3><p>Нажмите на сердечко на карточке товара, чтобы сохранить его здесь.</p></div>`;
                } else {
                    renderProducts(favProducts);
                }
            } else {
                resetView();
            }
        }

        function toggleFav(id, event) {
            event.stopPropagation();
            if (favorites.includes(id)) {
                favorites = favorites.filter(f => f !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('radzhiv_favs', JSON.stringify(favorites));
            if(showFavoritesOnly) toggleFavView(); else filterProducts();
        }

        function renderProducts(items) {
            grid.innerHTML = '';
            if (items.length === 0 && !showFavoritesOnly) { 
                grid.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><h3>Ничего не найдено</h3><p>Попробуйте изменить запрос или категорию.</p></div>'; 
                return; 
            }
            
            items.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                if(p.status === 'sold') card.style.opacity = '0.6';
                
                let badge = '';
                if (p.status === 'sold') badge = '<div class="badge sold">Продано</div>';
                else if (p.old_price && p.old_price !== '') {
                    let oldP = parseInt(p.old_price.replace(/\D/g,''));
                    let newP = parseInt(p.price.replace(/\D/g,''));
                    let disc = oldP > newP ? Math.round((1 - newP/oldP) * 100) : 0;
                    badge = `<div class="badge">-${disc}%</div>`;
                }
                
                let priceHtml = `<div class="price">${p.price}</div>`;
                if (p.old_price && p.old_price !== '') priceHtml += `<div class="old-price">${p.old_price}</div>`;
                
                let isFav = favorites.includes(p.id) ? 'active' : '';
                let heartIcon = isFav ? '❤️' : '🤍';

                card.innerHTML = `
                    <div class="card-img-wrapper">
                        ${badge}
                        <div class="heart ${isFav}" onclick="toggleFav(${p.id}, event)">${heartIcon}</div>
                        <img src="${p.imgs[0]}" loading="lazy">
                    </div>
                    <div class="card-info">
                        <div class="title">${p.name}</div>
                        <div class="price-row">${priceHtml}</div>
                        <button class="buy-btn ${p.status === 'sold' ? 'disabled' : ''}" onclick="event.stopPropagation(); addToCart(${p.id})">${p.status === 'sold' ? 'Нет в наличии' : 'В корзину'}</button>
                    </div>
                `;
                card.onclick = () => openModal(p);
                grid.appendChild(card);
            });
        }

        searchInput.addEventListener('input', filterProducts);

        // --- СЛАЙДЕР ---
        function moveSlider(direction) {
            const slider = document.getElementById('modal-slider');
            const images = slider.querySelectorAll('img');
            if(images.length <= 1) return;
            
            currentSlideIndex = (currentSlideIndex + direction + images.length) % images.length;
            images[currentSlideIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }

        function openModal(p) {
            currentProduct = p;
            selectedSize = "";
            currentSlideIndex = 0;
            
            const slider = document.getElementById('modal-slider');
            slider.innerHTML = '';
            p.imgs.forEach(src => { const img = document.createElement('img'); img.src = src; slider.appendChild(img); });
            
            document.getElementById('modal-title').innerText = p.name;
            document.getElementById('modal-price').innerText = p.price;
            document.getElementById('modal-old-price').innerText = (p.old_price && p.old_price !== '') ? p.old_price : '';
            document.getElementById('modal-desc').innerText = p.desc || 'Описание отсутствует.';
            
            const sizesWrap = document.getElementById('modal-sizes');
            sizesWrap.innerHTML = '';
            if (p.sizes && p.sizes.length > 0) {
                p.sizes.forEach(s => {
                    const btn = document.createElement('button');
                    btn.className = 'size-btn';
                    btn.innerText = s;
                    btn.onclick = () => {
                        document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        selectedSize = s;
                    };
                    sizesWrap.appendChild(btn);
                });
            }

            const simGrid = document.getElementById('similar-grid');
            simGrid.innerHTML = '';
            const similar = products.filter(x => x.category === p.category && x.id !== p.id && x.status !== 'sold').slice(0, 4);
            similar.forEach(sim => {
                const el = document.createElement('div');
                el.className = 'similar-item';
                el.innerHTML = `<img src="${sim.imgs[0]}"><div>${sim.name}</div><b>${sim.price}</b>`;
                el.onclick = () => openModal(sim);
                simGrid.appendChild(el);
            });
            
            const buyBtn = document.getElementById('modal-buy');
            if (p.status === 'sold') { buyBtn.innerText = 'Нет в наличии'; buyBtn.className = 'modal-buy-btn disabled'; buyBtn.disabled = true; }
            else { buyBtn.innerText = 'В корзину'; buyBtn.className = 'modal-buy-btn'; buyBtn.disabled = false; }
            
            modal.style.display = 'flex'; document.body.style.overflow = 'hidden';
        }

        function closeModal() { modal.style.display = 'none'; document.body.style.overflow = 'auto'; currentProduct = null; }

        function addToCart(id) {
            let p = products.find(x => x.id === id);
            if (p.sizes && p.sizes.length > 0) {
                openModal(p);
                return;
            }
            pushToCart(p, "Без размера");
        }

        function addToCartFromModal() {
            if (currentProduct) {
                if (currentProduct.sizes && currentProduct.sizes.length > 0 && !selectedSize) {
                    if(tg) tg.showAlert("Пожалуйста, выберите размер!"); else alert("Пожалуйста, выберите размер!");
                    return;
                }
                pushToCart(currentProduct, selectedSize || "Без размера");
                closeModal();
            }
        }

        function pushToCart(p, size) {
            cart.push({ id: p.id, name: p.name, price: p.price, size: size, img: p.imgs[0] });
            localStorage.setItem('radzhiv_cart', JSON.stringify(cart));
            updateCartBadge();
            if(tg) tg.HapticFeedback.notificationOccurred('success');
        }

        function openCart() {
            const wrap = document.getElementById('cart-items-wrap');
            wrap.innerHTML = '';
            let total = 0;
            cart.forEach((item, idx) => {
                let numPrice = parseInt(item.price.replace(/\D/g,'')) || 0;
                total += numPrice;
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <img src="${item.img}">
                    <div class="cart-item-info">
                        <h4>${item.name}</h4>
                        <div style="font-size:12px; color:var(--text-muted);">Размер: ${item.size}</div>
                        <span>${item.price}</span>
                    </div>
                    <button style="background:var(--price); border:none; color:white; padding:8px; border-radius:8px; cursor:pointer;" onclick="removeFromCart(${idx})">✖</button>
                `;
                wrap.appendChild(div);
            });
            if(cart.length === 0) wrap.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding: 20px 0;">Корзина пуста</p>';
            document.getElementById('cart-total').innerText = `Итого: ${total} ₽`;
            document.getElementById('cartModal').style.display = 'flex';
        }

        function closeCart() { document.getElementById('cartModal').style.display = 'none'; }

        function removeFromCart(idx) {
            cart.splice(idx, 1);
            localStorage.setItem('radzhiv_cart', JSON.stringify(cart));
            updateCartBadge();
            openCart();
        }

        function checkout() {
            if (cart.length === 0) return;
            
            let promo = document.getElementById('promo-input').value;
            let total = cart.reduce((sum, item) => sum + (parseInt(item.price.replace(/\D/g,'')) || 0), 0);
            let payload = { action: "checkout", items: cart, promo: promo, total: total };
            
            if (tg) { 
                tg.HapticFeedback.impactOccurred('heavy'); 
                tg.sendData(JSON.stringify(payload)); 
                setTimeout(() => { 
                    tg.close(); 
                    cart = []; 
                    localStorage.setItem('radzhiv_cart', JSON.stringify(cart));
                    updateCartBadge();
                }, 300); 
            } else { 
                cart = []; 
                localStorage.setItem('radzhiv_cart', JSON.stringify(cart));
                updateCartBadge();
                closeCart();
                document.getElementById('successModal').style.display = 'flex';
            }
        }

        function closeSuccess() { document.getElementById('successModal').style.display = 'none'; }

        function askQuestion() {
            if(tg) tg.openTelegramLink("https://t.me/MESH_VA");
            else window.location.href = "https://t.me/MESH_VA";
        }

        resetView();
        updateCartBadge();
    </script>
</body>
</html>
