
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RADZHIV.SHOP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { 
            --bg: #09090b; --surface: #18181b; --card: #1f1f23; --text: #f4f4f5; --muted: #a1a1aa; 
            --accent: #3b82f6; --accent-hover: #2563eb; --price: #ef4444; --success: #10b981; --radius: 16px;
        }
        * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(circle at 50% 0%, #1f1f27 0%, var(--bg) 80%); color: var(--text); margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(10px); } }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 50% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
        @keyframes slideUpModal { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes ripple { to { transform: scale(4); opacity: 0; } }
        @keyframes skeletonPulse { 0% { background-color: #27272a; } 50% { background-color: #3f3f46; } 100% { background-color: #27272a; } }
        
        .top-header { display: flex; align-items: center; gap: 15px; padding: 15px 30px; background: rgba(9, 9, 11, 0.7); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: 900; font-size: 24px; letter-spacing: 1px; text-transform: uppercase; color: var(--text); text-decoration: none; }
        
        .search-wrapper { flex-grow: 1; position: relative; max-width: 400px; }
        .search-box { width: 100%; padding: 12px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: #18181b; color: var(--text); font-size: 15px; outline: none; transition: 0.3s ease; }
        .search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); background: #27272a; }
        
        .header-actions { display: flex; gap: 15px; font-size: 22px; align-items: center; margin-left: auto; }
        .icon-btn { cursor: pointer; transition: transform 0.2s, color 0.2s; position: relative; background: #27272a; padding: 8px; border-radius: 12px; border: 1px solid transparent;}
        .icon-btn:hover { transform: scale(1.05); color: var(--accent); border-color: rgba(255,255,255,0.1);}
        .cart-badge { position: absolute; top: -5px; right: -5px; background: var(--price); color: white; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 10px; display: none; }

        .page-title-wrap { max-width: 1300px; margin: 30px auto 10px auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center;}
        .page-title { font-size: 32px; font-weight: 900; margin: 0; }

        .container { max-width: 1300px; margin: 0 auto; padding: 0 20px 60px 20px; flex-grow: 1; width: 100%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        
        .skeleton-card { background: #18181b; border-radius: var(--radius); height: 340px; animation: skeletonPulse 1.5s infinite; }
        
        .card { background: var(--card); border-radius: var(--radius); display: flex; flex-direction: column; cursor: pointer; position: relative; transition: transform 0.3s ease, box-shadow 0.3s ease; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); animation: fadeInUp 0.5s ease backwards; }
        .card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.6); border-color: rgba(255,255,255,0.15); }
        .card-img-wrapper { position: relative; width: 100%; aspect-ratio: 1/1; overflow: hidden; background: #000; }
        .card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        .card:hover .card-img-wrapper img { transform: scale(1.1); }
        
        .badge { position: absolute; top: 12px; left: 12px; background: var(--price); color: white; font-size: 11px; font-weight: 900; padding: 4px 10px; border-radius: 8px; z-index: 10; }
        .heart { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; z-index: 10; transition: 0.2s; }
        .heart.active { color: var(--price); }
        
        .card-info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .title { font-size: 15px; font-weight: 600; margin: 0 0 8px 0; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 42px; }
        .price-row { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; margin-top: auto; flex-wrap: wrap; }
        .price { font-size: 22px; font-weight: 900; color: var(--price); }
        .old-price { font-size: 14px; text-decoration: line-through; color: var(--muted); }
        
        .buy-btn { background: var(--accent); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; width: 100%; cursor: pointer; transition: background 0.2s, transform 0.1s; position: relative; overflow: hidden; }
        .buy-btn.added { background: var(--success); }
        .buy-btn.disabled { background: #3f3f46; color: #a1a1aa; pointer-events: none; }
        
        /* МОДАЛКИ */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity 0.3s ease; }
        .modal.show { display: flex; opacity: 1; }
        .modal-content { background: var(--surface); width: 100%; max-width: 800px; border-radius: 24px; padding: 0; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; position: relative; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.1); animation: slideUpModal 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .modal-close { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; cursor: pointer; z-index: 20; }
        .modal-close:hover { background: var(--price); }
        
        /* ФИЛЬТРЫ */
        .filter-group { margin-bottom: 20px; }
        .filter-group h4 { margin: 0 0 10px 0; font-size: 16px; }
        .filter-cats { display: flex; flex-wrap: wrap; gap: 10px; }
        .filter-cat-btn { background: #27272a; border: 1px solid transparent; color: var(--text); padding: 8px 16px; border-radius: 10px; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .filter-cat-btn.active { background: var(--accent); color: white; }
        .range-inputs { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
        .range-inputs input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #3f3f46; background: #18181b; color: white; font-size: 14px; outline: none; }
        
        .cart-modal, .orders-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 1100; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity 0.3s ease; }
        .cart-modal.show, .orders-modal.show { display: flex; opacity: 1; }
        .cart-content, .orders-content { background: var(--surface); width: 100%; max-width: 600px; border-radius: 24px; padding: 30px; max-height: 90vh; overflow-y: auto; position: relative; border: 1px solid rgba(255,255,255,0.1); animation: slideUpModal 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        
        .cart-item { display: flex; gap: 15px; margin-bottom: 15px; background: #27272a; padding: 12px; border-radius: 14px; align-items: center; animation: fadeInUp 0.3s ease; }
        .cart-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 10px; }
        .cart-total { font-size: 24px; font-weight: 900; text-align: right; margin: 20px 0; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .promo-input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #3f3f46; background: #18181b; color: white; margin-bottom: 15px; font-size: 15px; outline: none; }
        
        .order-card { background: #27272a; border-radius: 14px; padding: 15px; margin-bottom: 15px; }
        .order-card h4 { margin: 0 0 5px 0; color: var(--text); }
        .order-status { font-size: 12px; background: #ff9800; color: white; padding: 2px 8px; border-radius: 8px; display: inline-block; margin-bottom: 10px; }
        
        .footer { background: #09090b; padding: 40px 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); margin-top: auto; }
        .footer-links { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        .footer-links a { color: var(--text); text-decoration: none; font-size: 15px; font-weight: 600; background: #27272a; padding: 10px 20px; border-radius: 12px; transition: 0.2s; }
        .footer-links a:hover { background: var(--accent); }

        /* Плавающая поддержка */
        .support-fab { position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); z-index: 900; transition: 0.2s; }
        .support-fab:hover { transform: scale(1.1); background: var(--accent-hover); }

        @media (max-width: 600px) {
            .top-header { flex-wrap: wrap; padding: 10px; gap: 10px; }
            .search-wrapper { order: 3; max-width: 100%; width: 100%; }
            .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .title { font-size: 13px; height: 36px; }
            .price { font-size: 18px; }
            .buy-btn { font-size: 13px; padding: 10px; }
            .modal-content { border-radius: 20px 20px 0 0; max-height: 95vh; margin-top: auto; margin-bottom: 0; }
            .footer-links { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="top-header">
        <a href="#" class="logo" onclick="resetView(); return false;">RADZHIV.SHOP</a>
        <div class="search-wrapper"><input type="text" id="search" class="search-box" placeholder="Искать товары..." oninput="updateView()"></div>

    <script>
        function createRipple(event) {
            const button = event.currentTarget;
            const circle = document.createElement("span");
            const diameter = Math.max(button.clientWidth, button.clientHeight);
            const radius = diameter / 2;
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - button.offsetLeft - radius}px`;
            circle.style.top = `${event.clientY - button.offsetTop - radius}px`;
            circle.style.position = 'absolute'; circle.style.borderRadius = '50%'; circle.style.transform = 'scale(0)';
            circle.style.animation = 'ripple 0.6s linear'; circle.style.backgroundColor = 'rgba(255, 255, 255, 0.4)';
            const ripple = button.getElementsByClassName("ripple")[0];
            if (ripple) { ripple.remove(); }
            button.appendChild(circle);
        }

        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.setHeaderColor('#09090b'); }
        const products = [{"id": 1, "name": "🧥 МУЖСКАЯ ЧЁРНАЯ ХУДИ 🧥", "price": "450", "old_price": "", "category": "Кофты", "status": "instock", "desc": "Товар Б/У\nРазмер: S\nЦвет: Чёрный\nСостояние: Хорошее\n⚠️ Нюанс: есть небольшой дефект на шве кармана -  разошлась строчка (на фото). В остальном вещь без других заметных дефектов, ткань не застиранная, катышков нет.", "sizes": [], "imgs": ["img/1_img_0.jpg", "img/1_img_1.jpg", "img/1_img_2.jpg", "img/1_img_3.jpg", "img/1_img_4.jpg"]}, {"id": 2, "name": "🩳 ЧЁРНЫЕ ПЛЯЖНЫЕ ШОРТЫ 🩳", "price": "700", "old_price": "", "category": "Шорты", "status": "instock", "desc": "Новые, только примерялись. \n\nРазмер: S\nЦвет: Чёрный\nСостояние: Новое (без упаковки и бирок)\n\nВнутри есть сетчатая подкладка\nНа поясе шнурок для регулировки", "sizes": [], "imgs": ["img/2_img_0.jpg", "img/2_img_1.jpg", "img/2_img_2.jpg", "img/2_img_3.jpg", "img/2_img_4.jpg"]}, {"id": 3, "name": "👕ПЛОТНАЯ МУСКАЯ ФУТБОЛКА 👕", "price": "500", "old_price": "", "category": "Футболки", "status": "instock", "desc": "Практически новая вещь, надевалась пару раз - горло оказалось узковато.\nРазмер: S\nЦвет: Чёрный", "sizes": [], "imgs": ["img/3_img_0.jpg", "img/3_img_1.jpg"]}, {"id": 4, "name": "🧥УДЛИНЕННАЯ ВЕТРОВКА O'STIN! 🧥", "price": "700", "old_price": "", "category": "Куртки", "status": "instock", "desc": "Легкая куртка-бомбер прямого кроя.  Подкладка - дышащая сетка. Застегивается на молнию.\nТовар Б/У\nБренд: O'Stin\nРазмер: 44 (S/M)\nЦвет: Синий\nСезон: Демисезон\nМатериал: Полиэстер\nСостояние: Хорошее\n⚠️ Нюанс: утерян шнурок внутренней кулиски на талии (металлические люверсы на месте, при желании можно вдеть новый). В остальном ткань, молния и манжеты полностью без дефектов.", "sizes": [], "imgs": ["img/4_img_0.jpg", "img/4_img_1.jpg", "img/4_img_2.jpg"]}];
        
        let currentProduct = null;
        let currentCategory = 'Все';
        let selectedSize = "";
        let showFavoritesOnly = false;
        
        let cart = JSON.parse(localStorage.getItem('radzhiv_cart')) || [];
        let favorites = JSON.parse(localStorage.getItem('radzhiv_favs')) || [];
        let orders = JSON.parse(localStorage.getItem('radzhiv_orders')) || [];
        
        let currentSlideIndex = 0;

        const grid = document.getElementById('product-grid');
        const pageTitle = document.getElementById('page-title');
        const favIcon = document.getElementById('fav-icon');

        function updateCartBadge() {
            const badge = document.getElementById('cart-badge');
            badge.innerText = cart.length;
            badge.style.display = cart.length > 0 ? 'block' : 'none';
        }

        function resetView() {
            currentCategory = 'Все'; showFavoritesOnly = false;
            document.getElementById('search').value = '';
            document.getElementById('price-min').value = '';
            document.getElementById('price-max').value = '';
            pageTitle.innerHTML = 'Каталог'; favIcon.style.color = 'white';
            updateView();
        }

        function initFilterCategories() {
            const cats = ['Все', ...new Set(products.map(p => p.category).filter(Boolean))];
            const container = document.getElementById('filter-cats-container');
            container.innerHTML = '';
            cats.forEach(c => {
                const btn = document.createElement('button');
                btn.className = `filter-cat-btn ${c === currentCategory ? 'active' : ''}`;
                btn.innerText = c;
                btn.onclick = () => { currentCategory = c; initFilterCategories(); updateView(); };
                container.appendChild(btn);
            });
        }

        function openFilters() { initFilterCategories(); document.getElementById('filterModal').classList.add('show'); }
        function closeFilters() { document.getElementById('filterModal').classList.remove('show'); }

        function toggleFavView() {
            showFavoritesOnly = !showFavoritesOnly;
            favIcon.style.color = showFavoritesOnly ? 'var(--price)' : 'white';
            if (showFavoritesOnly) currentCategory = 'Все';
            updateView();
        }

        function toggleFav(id, event) {
            event.stopPropagation();
            const heart = event.currentTarget;
            if (favorites.includes(id)) {
                favorites = favorites.filter(f => f !== id);
                heart.classList.remove('active'); heart.innerHTML = '🤍';
                if (showFavoritesOnly) { heart.closest('.card').style.animation = 'fadeOut 0.3s forwards'; setTimeout(() => updateView(), 300); }
            } else {
                favorites.push(id); heart.classList.add('active'); heart.innerHTML = '❤️';
                heart.style.animation = 'popIn 0.4s ease';
            }
            localStorage.setItem('radzhiv_favs', JSON.stringify(favorites));
        }

        function updateView() {
            let list = products;
            if (showFavoritesOnly) { list = list.filter(p => favorites.includes(p.id)); pageTitle.innerHTML = '❤️ Избранное'; }
            else { pageTitle.innerHTML = currentCategory === 'Все' ? 'Каталог' : currentCategory; }

            if (currentCategory !== 'Все') list = list.filter(p => p.category === currentCategory);
            
            const term = document.getElementById('search').value.toLowerCase();
            if (term) list = list.filter(p => p.name.toLowerCase().includes(term));

            const pMin = parseInt(document.getElementById('price-min').value) || 0;
            const pMax = parseInt(document.getElementById('price-max').value) || Infinity;
            list = list.filter(p => {
                const price = parseInt(p.price.replace(/\D/g,'')) || 0;
                return price >= pMin && price <= pMax;
            });

            grid.innerHTML = '';
            if (list.length === 0) { 
                grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding: 50px; color:var(--muted);"><div style="font-size:60px; margin-bottom:20px;">🔍</div><h3>Ничего не найдено</h3><p>Измените фильтры или запрос.</p></div>`; 
                return; 
            }
            
            list.forEach((p, index) => {
                const card = document.createElement('div');
                card.className = 'card'; card.setAttribute('data-id', p.id);
                card.style.animationDelay = `${index * 0.05}s`;
                if(p.status === 'sold') card.style.opacity = '0.6';
                
                let badge = '';
                if (p.status === 'sold') badge = '<div class="badge" style="background:#52525b;">Продано</div>';
                else if (p.old_price && p.old_price !== '') {
                    let oldP = parseInt(p.old_price.replace(/\D/g,'')), newP = parseInt(p.price.replace(/\D/g,''));
                    let disc = oldP > newP ? Math.round((1 - newP/oldP) * 100) : 0;
                    badge = `<div class="badge">-${disc}%</div>`;
                }
                
                let priceHtml = `<div class="price">${p.price}</div>`;
                if (p.old_price && p.old_price !== '') priceHtml += `<div class="old-price">${p.old_price}</div>`;
                
                let isFav = favorites.includes(p.id) ? 'active' : '';
                let heartIcon = isFav ? '❤️' : '🤍';
                let inCart = cart.some(c => c.id === p.id);
                let btnClass = p.status === 'sold' ? 'disabled' : (inCart ? 'added' : '');
                let btnText = p.status === 'sold' ? 'Нет в наличии' : (inCart ? 'В корзине' : 'В корзину');

                card.innerHTML = `
                    <div class="card-img-wrapper">
                        ${badge}
                        <div class="heart ${isFav}" onclick="toggleFav(${p.id}, event)">${heartIcon}</div>
                        <img src="${p.imgs[0]}" loading="lazy">
                    </div>
                    <div class="card-info">
                        <div class="title">${p.name}</div>
                        <div class="price-row">${priceHtml}</div>
                        <button class="buy-btn ${btnClass}" onclick="event.stopPropagation(); addToCart(${p.id}, event)">${btnText}</button>
                    </div>
                `;
                card.onclick = () => openModal(p);
                grid.appendChild(card);
            });
        }

        function updateCardButton(id, inCart) {
            const card = document.querySelector(`.card[data-id="${id}"]`);
            if (card) {
                const btn = card.querySelector('.buy-btn');
                if (btn && !btn.classList.contains('disabled')) {
                    if (inCart) { btn.classList.add('added'); btn.innerText = 'В корзине'; }
                    else { btn.classList.remove('added'); btn.innerText = 'В корзину'; }
                }
            }
        }

        function moveSlider(direction) {
            const slider = document.getElementById('modal-slider');
            const images = slider.querySelectorAll('img');
            if(images.length <= 1) return;
            currentSlideIndex = (currentSlideIndex + direction + images.length) % images.length;
            images[currentSlideIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }

        function openModal(p) {
            currentProduct = p; selectedSize = ""; currentSlideIndex = 0;
            const slider = document.getElementById('modal-slider');
            slider.innerHTML = '';
            p.imgs.forEach(src => { const img = document.createElement('img'); img.src = src; img.style.flex = '0 0 100%'; img.style.width = '100%'; img.style.height = '100%'; img.style.objectFit = 'contain'; img.style.scrollSnapAlign = 'center'; slider.appendChild(img); });
            
            document.getElementById('modal-title').innerText = p.name;
            document.getElementById('modal-price').innerText = p.price;
            document.getElementById('modal-old-price').innerText = (p.old_price && p.old_price !== '') ? p.old_price : '';
            document.getElementById('modal-desc').innerText = p.desc || 'Описание отсутствует.';
            
            const sizesWrap = document.getElementById('modal-sizes'); sizesWrap.innerHTML = '';
            if (p.sizes && p.sizes.length > 0) {
                p.sizes.forEach(s => {
                    const btn = document.createElement('button'); btn.className = 'size-btn'; btn.innerText = s;
                    btn.style.padding = '10px 15px'; btn.style.border = '2px solid #3f3f46'; btn.style.background = 'transparent'; btn.style.color = 'white'; btn.style.borderRadius = '10px'; btn.style.cursor = 'pointer';
                    btn.onclick = () => { document.querySelectorAll('.size-btn').forEach(b => b.style.borderColor = '#3f3f46'); btn.style.borderColor = 'var(--accent)'; selectedSize = s; };
                    sizesWrap.appendChild(btn);
                });
            }

            const buyBtn = document.getElementById('modal-buy');
            if (p.status === 'sold') { buyBtn.innerText = 'Нет в наличии'; buyBtn.className = 'buy-btn disabled'; buyBtn.disabled = true; }
            else { let inCart = cart.some(c => c.id === p.id); buyBtn.innerText = inCart ? 'В корзине' : 'В корзину'; buyBtn.className = inCart ? 'buy-btn added' : 'buy-btn'; buyBtn.disabled = false; }
            
            document.getElementById('productModal').classList.add('show');
        }

        function closeModal() { document.getElementById('productModal').classList.remove('show'); currentProduct = null; }

        function shareProduct() {
            if (!currentProduct) return;
            const text = `Глянь эту вещь: ${currentProduct.name} за ${currentProduct.price}!`;
            const url = "https://radzhivcik.github.io/radzhiv-shop/";
            if (tg) tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`);
            else alert(`Скопируй ссылку: ${url}`);
        }

        function addToCart(id, event) {
            if(event) createRipple(event);
            let p = products.find(x => x.id === id);
            if (p.sizes && p.sizes.length > 0) { openModal(p); return; }
            pushToCart(p, "Без размера");
        }

        function addToCartFromModal(event) {
            if(event) createRipple(event);
            if (currentProduct) {
                if (currentProduct.sizes && currentProduct.sizes.length > 0 && !selectedSize) { alert("Выберите размер!"); return; }
                pushToCart(currentProduct, selectedSize || "Без размера"); closeModal();
            }
        }

        function pushToCart(p, size) {
            cart.push({ id: p.id, name: p.name, price: p.price, size: size, img: p.imgs[0] });
            localStorage.setItem('radzhiv_cart', JSON.stringify(cart)); updateCartBadge();
            updateCardButton(p.id, true);
        }

        function openCart() {
            const wrap = document.getElementById('cart-items-wrap'); wrap.innerHTML = ''; let total = 0;
            cart.forEach((item, idx) => {
                total += parseInt(item.price.replace(/\D/g,'')) || 0;
                const div = document.createElement('div'); div.className = 'cart-item';
                div.innerHTML = `<img src="${item.img}"><div style="flex-grow:1;"><h4 style="margin:0 0 5px 0;">${item.name}</h4><div style="font-size:12px;color:var(--muted);">Размер: ${item.size}</div><span style="color:var(--price);font-weight:bold;">${item.price}</span></div><button style="background:var(--price);border:none;color:white;padding:10px;border-radius:10px;cursor:pointer;" onclick="removeFromCart(${idx}, event)">✖</button>`;
                wrap.appendChild(div);
            });
            if(cart.length === 0) wrap.innerHTML = '<p style="text-align:center;color:var(--muted);">Корзина пуста</p>';
            document.getElementById('cart-total').innerText = `Итого: ${total} ₽`;
            document.getElementById('cartModal').classList.add('show');
        }

        function closeCart() { document.getElementById('cartModal').classList.remove('show'); }

        function removeFromCart(idx, event) {
            const btn = event.currentTarget; btn.disabled = true;
            btn.closest('.cart-item').style.animation = 'fadeOut 0.3s ease forwards';
            setTimeout(() => {
                const removedItem = cart[idx]; cart.splice(idx, 1);
                localStorage.setItem('radzhiv_cart', JSON.stringify(cart)); updateCartBadge(); openCart();
                if (removedItem) { const stillInCart = cart.some(c => c.id === removedItem.id); if (!stillInCart) updateCardButton(removedItem.id, false); }
            }, 300);
        }

        function openOrders() {
            const list = document.getElementById('orders-list'); list.innerHTML = '';
            if (orders.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:var(--muted);">У вас пока нет заказов.</p>';
            } else {
                orders.reverse().forEach(o => {
                    const div = document.createElement('div'); div.className = 'order-card';
                    let itemsHtml = o.items.map(i => `• ${i.name} (${i.size})`).join('<br>');
                    div.innerHTML = `<h4>Заказ от ${o.date}</h4><div class="order-status">${o.status}</div><div style="font-size:14px; margin-bottom:10px;">${itemsHtml}</div><div style="font-weight:bold; text-align:right; color:var(--price);">Итого: ${o.total} ₽</div>`;
                    list.appendChild(div);
                });
            }
            document.getElementById('ordersModal').classList.add('show');
        }
        function closeOrders() { document.getElementById('ordersModal').classList.remove('show'); }

        function checkout(event) {
            if(event) createRipple(event);
            if (cart.length === 0) return;
            const btn = document.getElementById('checkout-btn'); btn.disabled = true; btn.innerText = "Отправка...";

            let promo = document.getElementById('promo-input').value;
            let total = cart.reduce((sum, item) => sum + (parseInt(item.price.replace(/\D/g,'')) || 0), 0);
            
            // Сохраняем в историю
            orders.push({ date: new Date().toLocaleDateString(), items: cart, total: total, status: "Ожидает подтверждения" });
            localStorage.setItem('radzhiv_orders', JSON.stringify(orders));

            let payload = { action: "checkout", items: cart, promo: promo, total: total };
            if (tg) { 
                tg.sendData(JSON.stringify(payload)); 
                setTimeout(() => { tg.close(); cart = []; localStorage.setItem('radzhiv_cart', JSON.stringify(cart)); updateCartBadge(); }, 300); 
            } else { 
                cart = []; localStorage.setItem('radzhiv_cart', JSON.stringify(cart)); updateCartBadge();
                closeCart(); document.getElementById('successModal').classList.add('show');
            }
        }

        function closeSuccess() { document.getElementById('successModal').classList.remove('show'); }
        function askQuestion() { if(tg) tg.openTelegramLink("https://t.me/radzhiv_shop_bot?start=support"); else window.location.href = "https://t.me/radzhiv_shop_bot"; }

        setTimeout(() => { resetView(); updateCartBadge(); }, 300);
    </script>
</body>
</html>
