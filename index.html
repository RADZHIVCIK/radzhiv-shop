<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RADZHIV.SHOP</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #09090b; --surface: #18181b; --card: #1f1f23; --text: #f4f4f5; --muted: #a1a1aa; --accent: #3b82f6; --price: #ef4444; --success: #10b981; --radius: 16px; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: radial-gradient(circle at 50% 0%, #1f1f27 0%, var(--bg) 80%); color: var(--text); margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(10px); } }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 50% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
        @keyframes slideUpModal { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes ripple { to { transform: scale(4); opacity: 0; } }
        .top-header { display: flex; align-items: center; gap: 15px; padding: 15px 30px; background: rgba(9, 9, 11, 0.7); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: 900; font-size: 24px; letter-spacing: 1px; text-transform: uppercase; color: var(--text); text-decoration: none; }
        .search-wrapper { flex-grow: 1; position: relative; max-width: 400px; }
        .search-box { width: 100%; padding: 12px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: #18181b; color: var(--text); font-size: 15px; outline: none; }
        .search-box:focus { border-color: var(--accent); }
        .header-actions { display: flex; gap: 15px; font-size: 22px; align-items: center; margin-left: auto; }
        .icon-btn { cursor: pointer; background: #27272a; padding: 8px 15px; border-radius: 12px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--text);}
        .icon-btn:hover { color: var(--accent); }
        .cart-badge { position: absolute; top: -5px; right: -5px; background: var(--price); color: white; font-size: 11px; padding: 2px 6px; border-radius: 10px; display: none; }
        .page-title-wrap { max-width: 1300px; margin: 30px auto 10px auto; padding: 0 20px; display: flex; justify-content: space-between; }
        .page-title { font-size: 32px; font-weight: 900; margin: 0; }
        .container { max-width: 1300px; margin: 0 auto; padding: 0 20px 60px 20px; flex-grow: 1; width: 100%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background: var(--card); border-radius: var(--radius); display: flex; flex-direction: column; cursor: pointer; transition: transform 0.3s; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); animation: fadeInUp 0.5s ease backwards; }
        .card:hover { transform: translateY(-8px); }
        .card-img-wrapper { position: relative; width: 100%; aspect-ratio: 1/1; overflow: hidden; background: #000; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .badge { position: absolute; top: 12px; left: 12px; background: var(--price); color: white; font-size: 11px; padding: 4px 10px; border-radius: 8px; z-index: 10; }
        .heart { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6); width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 10; }
        .card-info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .title { font-size: 15px; font-weight: 600; margin: 0 0 8px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 42px; }
        .price-row { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; margin-top: auto; }
        .price { font-size: 22px; font-weight: 900; color: var(--price); }
        .old-price { font-size: 14px; text-decoration: line-through; color: var(--muted); }
        .buy-btn { background: var(--accent); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; width: 100%; cursor: pointer; }
        .buy-btn.added { background: var(--success); }
        .buy-btn.disabled { background: #3f3f46; color: #a1a1aa; pointer-events: none; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal.show { display: flex; }
        .modal-content { background: var(--surface); width: 100%; max-width: 800px; border-radius: 24px; max-height: 90vh; overflow-y: auto; position: relative; }
        .modal-close { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; cursor: pointer; z-index: 20; }
        .slider-container { position: relative; background: #000; height: 350px; display: flex; }
        .slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; width: 100%; height: 100%; }
        .slider img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: contain; scroll-snap-align: center; }
        .slider-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 10; }
        .slider-arrow.left { left: 10px; } .slider-arrow.right { right: 10px; }
        .thumbnails-container { display: flex; gap: 10px; padding: 15px; overflow-x: auto; }
        .thumbnail { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; cursor: pointer; opacity: 0.4; border: 2px solid transparent; }
        .thumbnail.active { opacity: 1; border-color: var(--accent); }
        .cart-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1100; align-items: center; justify-content: center; padding: 20px; }
        .cart-modal.show { display: flex; }
        .cart-content { background: var(--surface); width: 100%; max-width: 600px; border-radius: 24px; padding: 30px; max-height: 90vh; overflow-y: auto; position: relative; }
        .cart-item { display: flex; gap: 15px; margin-bottom: 15px; background: #27272a; padding: 12px; border-radius: 14px; align-items: center; }
        .cart-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 10px; }
        .cart-total { font-size: 24px; font-weight: 900; text-align: right; margin: 20px 0; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .promo-input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #3f3f46; background: #18181b; color: white; margin-bottom: 15px; }
        .footer { background: #09090b; padding: 40px 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); margin-top: auto; }
        .footer-links { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; }
        .footer-links a { color: var(--text); text-decoration: none; font-size: 15px; background: #27272a; padding: 10px 20px; border-radius: 12px; }
        .support-fab { position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; cursor: pointer; z-index: 900; }
        @media (max-width: 600px) {
            .top-header { flex-direction: column; }
            .grid { grid-template-columns: 1fr 1fr; }
            .title { font-size: 13px; } .price { font-size: 18px; }
            .slider-container { height: 250px; }
            .footer-links { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="top-header">
        <a href="#" class="logo" onclick="resetView(); return false;">RADZHIV.SHOP</a>
        <div class="search-wrapper"><input type="text" id="search" class="search-box" placeholder="Искать..." oninput="updateView()"></div>
        <div class="header-actions">
            <span class="icon-btn" onclick="openFilters()">☰ Фильтры</span>
            <span class="icon-btn" onclick="openOrders()">📦</span>
            <span class="icon-btn" onclick="toggleFavView()" id="fav-icon">❤️</span>
            <span class="icon-btn" onclick="openCart()">🛒<span class="cart-badge" id="cart-badge">0</span></span>
        </div>
    </div>
    <div class="page-title-wrap">
        <h1 class="page-title" id="page-title">Каталог</h1>
        <button class="icon-btn" onclick="openHowItWorks()" style="background:transparent; color:var(--accent);">❓ Как заказать</button>
    </div>
    <div class="container"><div class="grid" id="product-grid"></div></div>

    <div class="modal" id="filterModal" onclick="if(event.target===this) closeFilters()">
        <div class="modal-content" style="max-width: 400px; padding: 30px;">
            <button class="modal-close" onclick="closeFilters()">✕</button>
            <h2>Фильтры</h2>
            <div class="filter-cats" id="filter-cats-container" style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px;"></div>
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <input type="number" id="price-min" placeholder="От" oninput="updateView()" style="width:100%; padding:10px; background:#18181b; border:1px solid #3f3f46; color:white; border-radius:8px;">
                <input type="number" id="price-max" placeholder="До" oninput="updateView()" style="width:100%; padding:10px; background:#18181b; border:1px solid #3f3f46; color:white; border-radius:8px;">
            </div>
            <button class="buy-btn" onclick="closeFilters()">Применить</button>
        </div>
    </div>

    <div class="modal" id="howItWorksModal" onclick="if(event.target===this) closeHowItWorks()">
        <div class="modal-content" style="max-width: 500px; padding: 30px;">
            <button class="modal-close" onclick="closeHowItWorks()">✕</button>
            <h2>Как заказать?</h2>
            <p>1. Выбираете вещи в корзину.<br>2. Нажимаете «Оформить».<br>3. Я пишу вам вечером.<br>4. Оплата СБП или Авито.<br>5. Отправка СДЭК.</p>
        </div>
    </div>

    <div class="modal" id="productModal" onclick="if(event.target===this) closeModal()">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="slider-container">
                <button class="slider-arrow left" onclick="moveSlider(-1)">❮</button>
                <div class="slider" id="modal-slider"></div>
                <button class="slider-arrow right" onclick="moveSlider(1)">❯</button>
            </div>
            <div class="thumbnails-container" id="modal-thumbnails"></div>
            <div style="padding: 25px;">
                <div id="modal-article" style="font-size: 12px; color: var(--muted);"></div>
                <h2 id="modal-title" style="font-size: 24px; font-weight: 900;"></h2>
                <div style="display:flex; gap:10px; margin-bottom:20px;">
                    <div id="modal-price" style="font-size: 28px; font-weight: 900; color: var(--price);"></div>
                    <div id="modal-old-price" style="font-size: 16px; text-decoration: line-through; color: var(--muted); margin-top:8px;"></div>
                </div>
                <div id="modal-sizes" style="display: flex; gap: 10px; margin-bottom: 20px;"></div>
                <div id="modal-desc" style="font-size: 15px; color: var(--muted); margin-bottom: 20px; white-space: pre-wrap;"></div>
                <button class="buy-btn" id="modal-buy" onclick="addToCartFromModal(event)" style="padding: 18px; font-size: 18px;">В корзину</button>
            </div>
        </div>
    </div>

    <div class="cart-modal" id="cartModal" onclick="if(event.target===this) closeCart()">
        <div class="cart-content">
            <button class="modal-close" onclick="closeCart()">✕</button>
            <h2>Корзина</h2>
            <div id="cart-items-wrap"></div>
            <div class="cart-total" id="cart-total">Итого: 0 ₽</div>
            <input type="text" id="promo-input" class="promo-input" placeholder="Промокод">
            <button class="buy-btn" id="checkout-btn" onclick="checkout(event)" style="padding: 18px;">Оформить заказ</button>
        </div>
    </div>

    <div class="cart-modal" id="ordersModal" onclick="if(event.target===this) closeOrders()">
        <div class="cart-content">
            <button class="modal-close" onclick="closeOrders()">✕</button>
            <h2>Мои заказы</h2>
            <div id="orders-list"></div>
        </div>
    </div>

    <div class="support-fab" onclick="askQuestion()">💬</div>
    <footer class="footer">
        <div class="footer-links">
            <a href="https://t.me/radzhiv_shop">📢 ТГ-канал</a>
            <a href="https://t.me/radzhivcik">👤 Личный ТГ</a>
            <a href="https://www.avito.ru/brands/dccca72fbbd04269296ab30af3d76df4">🟢 Авито</a>
        </div>
        <p style="color: var(--muted);">© RADZHIV.SHOP</p>
    </footer>
    <script>
        const tg = window.Telegram?.WebApp; if (tg) tg.expand();
        const products = [{"id": 1, "article": "RAD-0001", "name": "🩳 ЧЁРНЫЕ ПЛЯЖНЫЕ ШОРТЫ 🩳", "price": "700", "old_price": "", "category": "Шорты", "status": "instock", "desc": "Новые, только примерялись. \n\nРазмер: S\nЦвет: Чёрный\nСостояние: Новое (без упаковки и бирок)\n\nВнутри есть сетчатая подкладка\nНа поясе шнурок для регулировки", "sizes": [], "imgs": ["img/1_img_0.jpg", "img/1_img_1.jpg", "img/1_img_2.jpg", "img/1_img_3.jpg", "img/1_img_4.jpg"]}, {"id": 2, "article": "RAD-0002", "name": "👕ПЛОТНАЯ МУСКАЯ ФУТБОЛКА 👕", "price": "500", "old_price": "", "category": "Футболки", "status": "instock", "desc": "Практически новая вещь, надевалась пару раз - горло оказалось узковато.\nРазмер: S\nЦвет: Чёрный", "sizes": [], "imgs": ["img/2_img_0.jpg", "img/2_img_1.jpg"]}, {"id": 3, "article": "RAD-0003", "name": "🧥УДЛИНЕННАЯ ВЕТРОВКА O'STIN! 🧥", "price": "700", "old_price": "", "category": "Куртки", "status": "instock", "desc": "Легкая куртка-бомбер прямого кроя.  Подкладка - дышащая сетка. Застегивается на молнию.\nТовар Б/У\nБренд: O'Stin\nРазмер: 44 (S/M)\nЦвет: Синий\nСезон: Демисезон\nМатериал: Полиэстер\nСостояние: Хорошее\n⚠️ Нюанс: утерян шнурок внутренней кулиски на талии (металлические люверсы на месте, при желании можно вдеть новый). В остальном ткань, молния и манжеты полностью без дефектов.", "sizes": [], "imgs": ["img/3_img_0.jpg", "img/3_img_1.jpg", "img/3_img_2.jpg"]}];
        let currentProduct = null, currentCategory = 'Все', selectedSize = "", showFavoritesOnly = false;
        let cart = JSON.parse(localStorage.getItem('radzhiv_cart')) || [];
        let favorites = JSON.parse(localStorage.getItem('radzhiv_favs')) || [];
        let orders = JSON.parse(localStorage.getItem('radzhiv_orders')) || [];
        let currentSlideIndex = 0;

        function updateCartBadge() { document.getElementById('cart-badge').innerText = cart.length; document.getElementById('cart-badge').style.display = cart.length > 0 ? 'block' : 'none'; }
        function resetView() { currentCategory = 'Все'; showFavoritesOnly = false; document.getElementById('search').value = ''; document.getElementById('price-min').value = ''; document.getElementById('price-max').value = ''; document.getElementById('page-title').innerHTML = 'Каталог'; document.getElementById('fav-icon').style.color = 'white'; updateView(); }
        function initFilterCategories() {
            const cats = ['Все', ...new Set(products.map(p => p.category).filter(Boolean))];
            const container = document.getElementById('filter-cats-container'); container.innerHTML = '';
            cats.forEach(c => { const btn = document.createElement('button'); btn.className = `filter-cat-btn ${c === currentCategory ? 'active' : ''}`; btn.innerText = c; btn.onclick = () => { currentCategory = c; initFilterCategories(); updateView(); }; container.appendChild(btn); });
        }
        function openFilters() { initFilterCategories(); document.getElementById('filterModal').classList.add('show'); }
        function closeFilters() { document.getElementById('filterModal').classList.remove('show'); }
        function openHowItWorks() { document.getElementById('howItWorksModal').classList.add('show'); }
        function closeHowItWorks() { document.getElementById('howItWorksModal').classList.remove('show'); }
        function toggleFavView() { showFavoritesOnly = !showFavoritesOnly; document.getElementById('fav-icon').style.color = showFavoritesOnly ? 'var(--price)' : 'white'; if (showFavoritesOnly) currentCategory = 'Все'; updateView(); }
        function toggleFav(id, event) {
            event.stopPropagation(); const heart = event.currentTarget;
            if (favorites.includes(id)) { favorites = favorites.filter(f => f !== id); heart.classList.remove('active'); heart.innerHTML = '🤍'; }
            else { favorites.push(id); heart.classList.add('active'); heart.innerHTML = '❤️'; }
            localStorage.setItem('radzhiv_favs', JSON.stringify(favorites));
        }
        function updateView() {
            let list = products;
            if (showFavoritesOnly) { list = list.filter(p => favorites.includes(p.id)); document.getElementById('page-title').innerHTML = '❤️ Избранное'; }
            else { document.getElementById('page-title').innerHTML = currentCategory === 'Все' ? 'Каталог' : currentCategory; }
            if (currentCategory !== 'Все') list = list.filter(p => p.category === currentCategory);
            const term = document.getElementById('search').value.toLowerCase();
            if (term) list = list.filter(p => p.name.toLowerCase().includes(term) || p.article.toLowerCase().includes(term));
            const pMin = parseInt(document.getElementById('price-min').value) || 0, pMax = parseInt(document.getElementById('price-max').value) || Infinity;
            list = list.filter(p => { const price = parseInt(p.price.replace(/\D/g,'')) || 0; return price >= pMin && price <= pMax; });
            document.getElementById('product-grid').innerHTML = list.length === 0 ? '<p style="color:white;">Ничего не найдено</p>' : '';
            list.forEach((p, index) => {
                const card = document.createElement('div'); card.className = 'card';
                let badge = p.status === 'sold' ? '<div class="badge" style="background:#52525b;">Продано</div>' : (p.old_price ? `<div class="badge">-${Math.round((1 - parseInt(p.price.replace(/\D/g,''))/parseInt(p.old_price.replace(/\D/g,''))) * 100)}%</div>` : '');
                let priceHtml = `<div class="price">${p.price}</div>`; if (p.old_price) priceHtml += `<div class="old-price">${p.old_price}</div>`;
                let isFav = favorites.includes(p.id) ? 'active' : '';
                card.innerHTML = `
                    <div class="card-img-wrapper">${badge}<div class="heart ${isFav}" onclick="toggleFav(${p.id}, event)">${isFav?'❤️':'🤍'}</div><img src="${p.imgs[0]}"></div>
                    <div class="card-info"><div style="font-size:11px; color:var(--muted);">Арт: ${p.article}</div><div class="title">${p.name}</div><div class="price-row">${priceHtml}</div>
                    <button class="buy-btn ${p.status==='sold'?'disabled':''}" onclick="event.stopPropagation(); addToCart(${p.id}, event)">${p.status==='sold'?'Нет в наличии':'В корзину'}</button></div>`;
                card.onclick = () => openModal(p); document.getElementById('product-grid').appendChild(card);
            });
        }
        function moveSlider(direction) {
            const slider = document.getElementById('modal-slider'), images = slider.querySelectorAll('img');
            if(images.length <= 1) return;
            currentSlideIndex = (currentSlideIndex + direction + images.length) % images.length;
            images[currentSlideIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            document.querySelectorAll('.thumbnail').forEach((t, i) => { t.classList.toggle('active', i === currentSlideIndex); });
        }
        function openModal(p) {
            currentProduct = p; selectedSize = ""; currentSlideIndex = 0;
            const slider = document.getElementById('modal-slider'), thumbsWrap = document.getElementById('modal-thumbnails');
            slider.innerHTML = ''; thumbsWrap.innerHTML = '';
            p.imgs.forEach((src, i) => {
                const img = document.createElement('img'); img.src = src; slider.appendChild(img);
                const thumb = document.createElement('img'); thumb.src = src; thumb.className = `thumbnail ${i === 0 ? 'active' : ''}`;
                thumb.onclick = () => { currentSlideIndex = i; slider.querySelectorAll('img')[i].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); document.querySelectorAll('.thumbnail').forEach((t, j) => t.classList.toggle('active', j === i)); };
                thumbsWrap.appendChild(thumb);
            });
            document.getElementById('modal-article').innerText = `Артикул: ${p.article}`;
            document.getElementById('modal-title').innerText = p.name;
            document.getElementById('modal-price').innerText = p.price;
            document.getElementById('modal-old-price').innerText = p.old_price || '';
            document.getElementById('modal-desc').innerText = p.desc || '';
            const sizesWrap = document.getElementById('modal-sizes'); sizesWrap.innerHTML = '';
            if (p.sizes && p.sizes.length > 0) {
                p.sizes.forEach(s => {
                    const btn = document.createElement('button'); btn.innerText = s; btn.style.cssText = 'padding:10px 15px; border:2px solid #3f3f46; background:transparent; color:white; border-radius:10px; cursor:pointer;';
                    btn.onclick = () => { document.querySelectorAll('#modal-sizes button').forEach(b => b.style.borderColor = '#3f3f46'); btn.style.borderColor = 'var(--accent)'; selectedSize = s; };
                    sizesWrap.appendChild(btn);
                });
            }
            document.getElementById('modal-buy').disabled = p.status === 'sold';
            document.getElementById('productModal').classList.add('show');
        }
        function closeModal() { document.getElementById('productModal').classList.remove('show'); currentProduct = null; }
        function addToCart(id, event) { if(event) event.stopPropagation(); let p = products.find(x => x.id === id); pushToCart(p, "Без размера"); }
        function addToCartFromModal(event) { if (currentProduct) { pushToCart(currentProduct, selectedSize || "Без размера"); closeModal(); } }
        function pushToCart(p, size) { cart.push({ id: p.id, name: p.name, price: p.price, size: size, img: p.imgs[0], article: p.article }); localStorage.setItem('radzhiv_cart', JSON.stringify(cart)); updateCartBadge(); }
        function openCart() {
            const wrap = document.getElementById('cart-items-wrap'); wrap.innerHTML = ''; let total = 0;
            cart.forEach((item, idx) => {
                total += parseInt(item.price.replace(/\D/g,'')) || 0;
                const div = document.createElement('div'); div.className = 'cart-item';
                div.innerHTML = `<img src="${item.img}"><div style="flex-grow:1;"><div style="font-size:11px;color:var(--muted);">Арт: ${item.article}</div><h4>${item.name}</h4><span style="color:var(--price);font-weight:bold;">${item.price}</span></div><button style="background:var(--price);border:none;color:white;padding:10px;border-radius:10px;" onclick="cart.splice(${idx},1);localStorage.setItem('radzhiv_cart',JSON.stringify(cart));updateCartBadge();openCart();">✖</button>`;
                wrap.appendChild(div);
            });
            document.getElementById('cart-total').innerText = `Итого: ${total} ₽`; document.getElementById('cartModal').classList.add('show');
        }
        function closeCart() { document.getElementById('cartModal').classList.remove('show'); }
        function openOrders() {
            const list = document.getElementById('orders-list'); list.innerHTML = orders.length === 0 ? '<p>Нет заказов</p>' : '';
            [...orders].reverse().forEach(o => { const div = document.createElement('div'); div.className = 'order-card'; div.innerHTML = `<h4>Заказ от ${o.date}</h4><div class="order-status">${o.status}</div><div style="font-weight:bold; color:var(--price);">Итого: ${o.total} ₽</div>`; list.appendChild(div); });
            document.getElementById('ordersModal').classList.add('show');
        }
        function closeOrders() { document.getElementById('ordersModal').classList.remove('show'); }
        function checkout(event) {
            if (cart.length === 0) return; document.getElementById('checkout-btn').innerText = "Отправка...";
            let total = cart.reduce((sum, item) => sum + (parseInt(item.price.replace(/\D/g,'')) || 0), 0);
            orders.push({ date: new Date().toLocaleDateString(), items: cart, total: total, status: "Ожидает подтверждения" });
            localStorage.setItem('radzhiv_orders', JSON.stringify(orders));
            if (tg) { tg.sendData(JSON.stringify({ action: "checkout", items: cart, total: total })); setTimeout(() => { tg.close(); cart = []; localStorage.setItem('radzhiv_cart', JSON.stringify(cart)); updateCartBadge(); }, 300); }
            else { cart = []; localStorage.setItem('radzhiv_cart', JSON.stringify(cart)); updateCartBadge(); closeCart(); alert("Заказ отправлен!"); }
        }
        function askQuestion() { if(tg) tg.openTelegramLink("https://t.me/radzhiv_support_bot"); else window.location.href = "https://t.me/radzhiv_support_bot"; }
        setTimeout(() => { resetView(); updateCartBadge(); }, 300);
    </script>
</body>
</html>
